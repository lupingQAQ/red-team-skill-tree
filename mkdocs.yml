  - "12. AI-Powered Attacks": ch-12.md
  - "13. Cloud-Native Attack and Defense": ch-13.md
  - "14. Modern C2 Evolution": ch-14.md
  - "15. Advanced Evasion Techniques": ch-15.md
  - "16. Latest AD/Infrastructure Attacks": ch-16.md
  - "17. Initial Access Evolution": ch-17.md
  - "18. Cloud Post-Exploitation": ch-18.md
  - "19. HVV / Red-vs-Blue Practical Topics": ch-19.md
