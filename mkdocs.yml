site_name: Red Team Skill Tree
site_description: >-
  Full-stack offensive security reference — anti-attribution, reconnaissance,
  AD attacks, C2 development, AV/EDR evasion, cloud-native and AI-powered
  attacks, updated with 2025-2026 APT techniques.
site_url: https://lupingqaq.github.io/red-team-skill-tree/
repo_url: https://github.com/lupingQAQ/red-team-skill-tree
repo_name: lupingQAQ/red-team-skill-tree
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
extra:
  alternate:
    - name: English
      link: /red-team-skill-tree/
      lang: en
    - name: 简体中文
      link: /red-team-skill-tree/zh-CN/
      lang: zh
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
nav:
  - Home: index.md
  - "1. Anti-Attribution and Anonymization": ch-01.md
  - "2. Reconnaissance": ch-02.md
  - "3. Penetration Testing in Practice": ch-03.md
